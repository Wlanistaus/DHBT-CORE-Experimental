<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DHBT Dashboard</title>
  <!-- DHBT-Code | Developt by DHBT -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="/analyticsDashboard.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{background:#070d1f;color:#e8eaf6;font-family:'Inter','Segoe UI',sans-serif;line-height:1.5}

    /* Background */
    .bg-glow{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;
      background:radial-gradient(ellipse at 15% 0%,rgba(77,163,255,0.13) 0%,transparent 55%),
                 radial-gradient(ellipse at 85% 10%,rgba(109,141,255,0.10) 0%,transparent 50%),
                 radial-gradient(ellipse at 50% 90%,rgba(166,107,255,0.08) 0%,transparent 50%);
      pointer-events:none}

    /* Sidebar */
    #sidebar{
      background:rgba(10,17,41,0.92);border-right:1px solid rgba(255,255,255,0.07);
      backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      display:flex;flex-direction:column;gap:0;padding:0;width:14.5rem;min-height:100vh;overflow-y:auto
    }
    .sidebar-header{padding:1.25rem 1rem 1rem;border-bottom:1px solid rgba(255,255,255,0.07);margin-bottom:.5rem}
    .sidebar-header h2{font-size:1rem;font-weight:700;color:#fff;letter-spacing:-.01em}
    .sidebar-footer{padding:.75rem 1rem 1rem;border-top:1px solid rgba(255,255,255,0.07);margin-top:auto}

    .nav-category{padding:.3rem .75rem .3rem .75rem;margin-top:.6rem;font-size:.68rem;font-weight:700;text-transform:uppercase;
      letter-spacing:.08em;color:rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:space-between;
      cursor:pointer;user-select:none;transition:color .15s;border-radius:6px}
    .nav-category:hover{color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.04)}
    .nav-category .chevron{transition:transform .2s;font-size:.6rem;opacity:.6}
    .nav-category.expanded .chevron{transform:rotate(90deg)}

    .nav-items{overflow:hidden;transition:max-height .25s ease;padding:0 .5rem}
    .nav-items.collapsed{max-height:0}
    .nav-items.expanded{max-height:600px}

    .nav-item{padding:.42rem .65rem;border-radius:7px;cursor:pointer;transition:all .15s;
      font-size:.83rem;color:rgba(255,255,255,0.55);display:flex;align-items:center;gap:.4rem;margin-bottom:1px}
    .nav-item:hover{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.9)}
    .nav-item.active{background:linear-gradient(90deg,rgba(77,163,255,0.22),rgba(109,141,255,0.15));
      color:#7dc4ff;font-weight:600;border-left:2px solid #4DA3FF;padding-left:calc(.65rem - 2px)}

    /* Cards */
    .card{background:rgba(255,255,255,0.035);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:1.4rem;
      box-shadow:0 4px 24px rgba(0,0,0,0.25)}

    /* Inputs */
    .inp{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:9px;
      padding:.5rem .8rem;color:#ffffff;width:100%;font-size:.875rem;transition:border-color .15s,background .15s}
    .inp:focus{outline:none;border-color:#4DA3FF;background:rgba(77,163,255,0.07)}
    .inp::placeholder{color:rgba(255,255,255,0.3)}

    /* Buttons */
    .btn{padding:.45rem 1.1rem;border-radius:8px;font-weight:600;cursor:pointer;transition:all .15s;
      font-size:.855rem;border:none;display:inline-flex;align-items:center;gap:.35rem}
    .btn-blue{background:linear-gradient(135deg,#4DA3FF,#6D8DFF);color:#fff;box-shadow:0 2px 12px rgba(77,163,255,0.3)}
    .btn-blue:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 4px 16px rgba(77,163,255,0.4)}
    .btn-red{background:#ed4245;color:#fff;box-shadow:0 2px 8px rgba(237,66,69,0.25)}
    .btn-red:hover{background:#c03537;transform:translateY(-1px)}
    .btn-green{background:#3ba55c;color:#fff;box-shadow:0 2px 8px rgba(59,165,92,0.25)}
    .btn-green:hover{background:#2d7d46;transform:translateY(-1px)}
    .btn-gray{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.85);border:1px solid rgba(255,255,255,0.12)}
    .btn-gray:hover{background:rgba(255,255,255,0.12);transform:translateY(-1px)}

    /* Tables */
    table{width:100%;font-size:.855rem;border-collapse:separate;border-spacing:0}
    th{text-align:left;padding:.6rem .75rem .6rem 0;color:rgba(255,255,255,0.45);font-weight:600;
      font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid rgba(255,255,255,0.08)}
    td{padding:.6rem .75rem .6rem 0;border-bottom:1px solid rgba(255,255,255,0.05);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tbody tr:hover td{background:rgba(255,255,255,0.04)}

    /* Toast */
    .toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:.7rem 1.15rem;border-radius:10px;
      font-weight:600;font-size:.875rem;z-index:9999;animation:fadein .2s;
      box-shadow:0 4px 20px rgba(0,0,0,0.4);display:flex;align-items:center;gap:.5rem}
    @keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

    /* Scrollbar */
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.22)}

    /* Misc */
    select.inp option,select.inp optgroup{background:#0c1530;color:#fff}
    input[type="date"],input[type="datetime-local"],input[type="time"]{color-scheme:dark}
    canvas{background:transparent!important}
    main{background:transparent}

    /* Section heading */
    .section-title{font-size:1.4rem;font-weight:800;color:#fff;letter-spacing:-.02em;margin-bottom:1.5rem;
      display:flex;align-items:center;gap:.5rem}
    .section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.07);margin-left:.75rem}

    /* Stat badge */
    .stat-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:20px;
      font-size:.75rem;font-weight:600;background:rgba(77,163,255,0.15);color:#7dc4ff}

    /* Skeleton loader */
    .skeleton{background:linear-gradient(90deg,rgba(255,255,255,0.06) 25%,rgba(255,255,255,0.12) 50%,rgba(255,255,255,0.06) 75%);
      background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .skel-line{height:14px;margin-bottom:10px;border-radius:4px}
    .skel-circle{border-radius:50%}

    /* Confirmation Modal */
    #dhbt-modal-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);
      display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s}
    #dhbt-modal-overlay.open{opacity:1;pointer-events:all}
    #dhbt-modal-box{background:#0e1838;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:1.75rem;
      width:100%;max-width:400px;box-shadow:0 16px 60px rgba(0,0,0,0.6);transform:scale(.95);transition:transform .18s}
    #dhbt-modal-overlay.open #dhbt-modal-box{transform:scale(1)}
    #dhbt-modal-icon{font-size:2rem;margin-bottom:.6rem;text-align:center}
    #dhbt-modal-title{font-size:1.1rem;font-weight:700;color:#fff;text-align:center;margin-bottom:.4rem}
    #dhbt-modal-msg{font-size:.875rem;color:rgba(255,255,255,0.6);text-align:center;margin-bottom:1.25rem}
    #dhbt-modal-btns{display:flex;gap:.75rem;justify-content:center}

    /* Sidebar badge */
    .nav-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;
      padding:0 5px;border-radius:99px;font-size:.65rem;font-weight:700;background:#ed4245;color:#fff;margin-left:auto}

    /* Table search */
    .tbl-search{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem}
    .tbl-search input{max-width:240px}

    /* Stat card improved */
    .stat-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:14px;
      padding:1.25rem 1.5rem;display:flex;align-items:center;gap:1rem;transition:border-color .15s}
    .stat-card:hover{border-color:rgba(255,255,255,0.15)}
    .stat-card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
    .stat-card-val{font-size:1.75rem;font-weight:800;line-height:1;margin-bottom:.2rem}
    .stat-card-lbl{font-size:.75rem;color:rgba(255,255,255,0.5);font-weight:500}

    @media(max-width:640px){
      #sidebar{position:fixed;left:-15rem;top:0;bottom:0;z-index:40;transition:left .22s;width:15rem}
      #sidebar.open{left:0;box-shadow:4px 0 32px rgba(0,0,0,0.5)}
      #menuToggle{display:block!important}
      main{padding:1rem;padding-top:3.5rem}
    }
  </style>
</head>

let userNames={}, myPermissions=[], myRole='', myUsername='';
let myGuildId=null, myGuildName=null, myGuildIcon=null;
let currentSectionId='overview';
let _refreshTimer=null, _refreshActive=false;
const _syncToken = "MsxxqyxlathzIDKBYjtz";

// Guild-ID aus URL lesen: /dashboard/<guildId>
function getGuildIdFromUrl(){
  const m = window.location.pathname.match(/^\/dashboard\/(\d+)/);
  return m ? m[1] : null;
}

const ALL_SECTIONS=[
  {id:'overview',      label:'📊 Übersicht',        perm:'overview',        category:'Übersicht'},
  {id:'botStatus', label:'🖥️️ Bot Status',       perm:'overview',        category:'Übersicht'},
  {id:'userSearch',    label:'🔍 User Suche',        perm:'overview',        category:'Übersicht'},

  {id:'coins', label:'💰 Coins Rangliste',   perm:'coins',           category:'Economy'},
  {id:'economy',       label:'⚙️ Economy Config',    perm:'economy',         category:'Economy'},

  {id:'xp',            label:'⭐ XP Rangliste',      perm:'xp',               category:'XP'},

  {id:'xpBooster',     label:'⚡ XP Booster',         perm:'xpConfig',         category:'XP'},
  {id:'achievements',  label:'🏆 Achievements',      perm:'achievements',      category:'XP'},
  {id:'weekly', label:'📅 Weekly Mission',    perm:'weekly',           category:'XP'},

function can(perm){return perm==='__self__'||myUsername==='admin'||myRole==='owner'||myPermissions.includes(perm);}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}
function uname(id){
  if(userNames[id]) return '<span class="font-semibold text-white">'+userNames[id]+'</span> <span class="text-xs text-white/50">'+id+'</span>';
  return '<span class="font-mono text-xs text-white/60">'+id+'</span>';
}
function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escapeAttr(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg,ok){
  const t=document.createElement('div');
  t.className='toast '+(ok!==false?'bg-[#3ba55c]':'bg-[#ed4245]')+' text-white';
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000);
}
function card(c){return '<div class="card" style="margin-bottom:1.25rem">'+c+'</div>';}
function h2t(t){return '<div class="section-title">'+t+'</div>';}
function skeleton(lines=4,width='100%'){return '<div style="width:'+width+'">'+Array.from({length:lines},(_,i)=>'<div class="skeleton skel-line" style="width:'+(i===lines-1?'60%':'100%')+';"></div>').join('')+'</div>';}

function dhbtConfirm(title,msg,icon='⚠️'){return new Promise(resolve=>{const o=document.getElementById('dhbt-modal-overlay');document.getElementById('dhbt-modal-icon').textContent=icon;document.getElementById('dhbt-modal-title').textContent=title;document.getElementById('dhbt-modal-msg').textContent=msg;const btns=document.getElementById('dhbt-modal-btns');btns.innerHTML='<button class="btn btn-gray" id="m-no">Abbrechen</button><button class="btn btn-red" id="m-yes">Bestätigen</button>';o.classList.add('open');const close=(v)=>{o.classList.remove('open');resolve(v);};document.getElementById('m-yes').onclick=()=>close(true);document.getElementById('m-no').onclick=()=>close(false);o.onclick=(e)=>{if(e.target===o)close(false);};}); }

function csvExport(filename,headers,rows){const esc=v=>('"'+String(v??'').replace(/"/g,'""')+'"');const content=[headers.map(esc).join(','),...rows.map(r=>r.map(esc).join(','))].join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(content);a.download=filename+'.csv';a.click();}

async function updateSidebarBadges(){
  try{
    const [k,b]=await Promise.all([
      fetch('/api/karten/orders').then(r=>r.json()).catch(()=>[]),
      fetch('/api/builder/orders').then(r=>r.json()).catch(()=>[])
    ]);
    const openK=(k||[]).filter(o=>o.status==='open'||o.status==='pending').length;
    const openB=(b||[]).filter(o=>o.status==='open'||o.status==='pending').length;
    ['kartenOrders','builderOrders'].forEach((sec,i)=>{
      const el=document.querySelector('[data-sec="'+sec+'"]');
      if(!el)return;

// ---- AUTH ----
async function login(){
  const username=document.getElementById('loginUser').value.trim();
  const password=document.getElementById('loginPass').value;
  const rememberMe=document.getElementById('loginRemember').checked;
  const errEl=document.getElementById('loginErr');
  errEl.style.display='none';
  const guildId=getGuildIdFromUrl();
  if(!guildId){ errEl.textContent='Keine Guild-ID in URL gefunden.'; errEl.style.display='block'; return; }
  const body={password,rememberMe,guildId};
  if(username) body.username=username;
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){
    const d=await r.json();
    myPermissions=d.permissions||[]; myRole=d.role; myUsername=username||'admin';
    myGuildId=d.guildId||guildId;
    if(d.firstLogin){
      showChangePasswordDialog(true);
    } else {
      showApp();
    }
  } else {
    const d=await r.json().catch(()=>({}));
    errEl.textContent=d.error||'Login fehlgeschlagen';
    errEl.style.display='block';
  }
}
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/dashboard';}
async function checkAuth(){
  try {
    const r=await fetch('/api/auth-check');
    if(!r.ok){ location.href='/dashboard'; return; }
    const d=await r.json();
    if(!d.loggedIn){ location.href='/dashboard'; return; }
    const urlGuildId=getGuildIdFromUrl();
    // Session-Guild muss mit URL-Guild übereinstimmen
    if(d.guildId && urlGuildId && d.guildId!==urlGuildId){
      await fetch('/api/logout',{method:'POST'});
      location.href='/dashboard';
      return;
    }
    if(!d.guildId && !urlGuildId){ location.href='/dashboard'; return; }
    myPermissions=d.permissions||[];myRole=d.role;myUsername=d.username;
    myGuildId=d.guildId||urlGuildId;
    if(myGuildId){
      const cg=await fetch('/api/current-guild').then(r=>r.json()).catch(()=>({}));
      if(cg.selected){myGuildName=cg.guildName;myGuildIcon=cg.guildIcon;}
    }
    // firstLogin prüfen
    const fl=await fetch('/api/first-login').then(r=>r.json()).catch(()=>({firstLogin:false}));
    if(fl.firstLogin){
      showChangePasswordDialog(true);
    } else {
      showApp();
    }
  } catch(e) { location.href='/dashboard'; }
}

      <p style="color:rgba(255,255,255,0.6);font-size:.85rem;margin:0 0 1.5rem">${isFirstLogin?'Bitte setze ein neues Passwort für deinen Dashboard-Zugang.':'Gib dein aktuelles und neues Passwort ein.'}</p>

      <input id="cpConfirm" type="password" placeholder="Neues Passwort bestätigen" style="width:100%;padding:.7rem .9rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:.9rem;margin-bottom:1rem;outline:none" />

  document.body.appendChild(overlay);
  document.getElementById('cpSubmit').onclick=async()=>{
    const errEl=document.getElementById('cpErr');
    errEl.style.display='none';
    const newPwd=document.getElementById('cpNew').value;

    const currentPwd=isFirstLogin?'':(document.getElementById('cpCurrent')?.value||'');
    if(newPwd.length<6){errEl.textContent='Passwort muss mindestens 6 Zeichen lang sein.';errEl.style.display='block';return;}
    if(newPwd!==confirmPwd){errEl.textContent='Passwörter stimmen nicht überein.';errEl.style.display='block';return;}

      errEl.textContent=d.error||'Fehler beim Ändern des Passworts.';

function buildNav(){
  const visible=ALL_SECTIONS.filter(s=>can(s.perm));
  const grouped={};
  for(const s of visible){(grouped[s.category]=grouped[s.category]||[]).push(s);}
  let html='';
  for(const [cat,items] of Object.entries(grouped)){
    const catId='cat-'+cat.toLowerCase().replace(/[^a-z0-9]/g,'');
    const hasActive=items.some(i=>i.id===currentSectionId);
    html+="<div class='nav-category "+(hasActive?'expanded':'')+"' onclick='toggleCategory(\""+catId+"\")' data-cat='"+catId+"'>"+cat+"<span class='chevron'>▶</span></div>";
    html+="<div class='nav-items "+(hasActive?'expanded':'collapsed')+"' data-cat-items='"+catId+"'>";
    html+=items.map(s=>"<div class='nav-item' onclick='showSection(\""+s.id+"\")' data-sec='"+s.id+"'>"+s.label+"</div>").join('');
    html+='</div>';
  }
  document.getElementById('navItems').innerHTML=html;
}
function toggleCategory(catId){
  const header=document.querySelector("[data-cat='"+catId+"']");
  const items=document.querySelector("[data-cat-items='"+catId+"']");
  if(!header||!items)return;
  const expanded=items.classList.contains('expanded');
  if(expanded){items.classList.remove('expanded');items.classList.add('collapsed');header.classList.remove('expanded');}
  else{items.classList.remove('collapsed');items.classList.add('expanded');header.classList.add('expanded');}
}
function showSection(id){
  const sec=ALL_SECTIONS.find(s=>s.id===id);
  if(!sec||!can(sec.perm)) return;
  if(sec.url){ location.href=sec.url; return; }
  currentSectionId=id;
  if(_refreshTimer){clearInterval(_refreshTimer);_refreshTimer=null;_refreshActive=false;}
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const el=document.querySelector("[data-sec='"+id+"']");
  if(el){
    el.classList.add('active');
    const catItems=el.closest('.nav-items');
    if(catItems){
      const catId=catItems.getAttribute('data-cat-items');
      const header=document.querySelector("[data-cat='"+catId+"']");
      catItems.classList.remove('collapsed');catItems.classList.add('expanded');
      if(header)header.classList.add('expanded');
    }
  }
  trackClientPage('/dashboard#'+id);
  if(sections[id]) sections[id]();
}
function trackClientPage(path){
  const match=document.cookie.match(/(?:^|; )cookie_consent=([^;]*)/);
  const consent=match?decodeURIComponent(match[1]):null;
  if(consent!=='accepted') return;
  const vMatch=document.cookie.match(/(?:^|; )_dhbt_vid=([^;]*)/);
  const visitorId=vMatch?decodeURIComponent(vMatch[1]):null;
  if(visitorId) try{localStorage.setItem('_dhbt_vid',visitorId);}catch(e){}
  fetch('/api/analytics/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,visitorId})}).catch(()=>{});
}
function startRefresh(fn,sec){
  _refreshActive=!_refreshActive;
  const btn=document.getElementById('refreshBtn');
  if(_refreshActive){
    if(btn)btn.textContent='⏹ Stop Auto-Refresh';
    _refreshTimer=setInterval(()=>sections[sec]&&sections[sec](),10000);
    toast('🔄 Auto-Refresh aktiv (10s)');
  } else {
    if(_refreshTimer){clearInterval(_refreshTimer);_refreshTimer=null;}
    if(btn)btn.textContent='🔄 Auto-Refresh';
    toast('⏹ Auto-Refresh gestoppt');
  }
}

function pollPreviewData(){
  const title=document.getElementById('poll-title')?.value?.trim()||'Abstimmung';
  const description=document.getElementById('poll-description')?.value?.trim()||'';
  const multiple=!!document.getElementById('poll-multiple')?.checked;
  const secret=!!document.getElementById('poll-secret')?.checked;
  const duration=Math.max(1,Number(document.getElementById('poll-duration')?.value||60));
  const opts=(window._pollOptions||[]).filter(o=>o.label.trim()).map(o=>({emoji:o.emoji.trim(),label:o.label.trim()}));
  return {title,description,multiple,secret,duration,options:opts};
}
function renderPollOptions(){
  const el=document.getElementById('poll-options');
  if(!el)return;
  const opts=window._pollOptions||[];
  el.innerHTML=opts.map((o,i)=>
    '<div class="flex gap-2 items-center p-2 rounded-lg" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)">'
    +'<input class="inp" style="width:62px;text-align:center" maxlength="8" value="'+escapeAttr(o.emoji)+'" placeholder="😀" oninput="updatePollOption('+i+',\'emoji\',this.value)">'
    +'<input class="inp flex-1" maxlength="80" value="'+escapeAttr(o.label)+'" placeholder="Antwort '+(i+1)+'" oninput="updatePollOption('+i+',\'label\',this.value)">'
    +(opts.length>2?'<button onclick="removePollOption('+i+')" class="btn btn-red" title="Entfernen">✕</button>':'')
    +'</div>'
  ).join('');
  const add=document.querySelector('button[onclick="addPollOption()"]');
  if(add) add.disabled=opts.length>=25;
  pollPreview();
}
function updatePollOption(i,key,value){
  if(!window._pollOptions?.[i])return;
  window._pollOptions[i][key]=value;
  pollPreview();
}
function addPollOption(){
  if((window._pollOptions||[]).length>=25){toast('❌ Maximal 25 Antworten',false);return;}
  const used=new Set((window._pollOptions||[]).map(o=>o.emoji));
  const emojis=['3️⃣','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟','🅰️','🅱️','🆎','🆗','🆙','🆒','🆕','🆓','🔴','🟢','🔵','🟡','🟣','⚫','⚪','🟠','🟤'];
  const emoji=emojis.find(e=>!used.has(e))||'🔘';
  window._pollOptions.push({emoji,label:'Antwort '+(window._pollOptions.length+1)});
  renderPollOptions();
}
function removePollOption(i){
  if((window._pollOptions||[]).length<=2)return;
  window._pollOptions.splice(i,1);
  renderPollOptions();
}

async function createPollFromDashboard(){
  const d=pollPreviewData();
  const channelId=document.getElementById('poll-channel')?.value||'';
  const roleIds=[...document.querySelectorAll('.poll-role:checked')].map(x=>x.value);
  if(!channelId){toast('❌ Bitte einen Channel auswählen',false);return;}
  if(!d.title){toast('❌ Titel erforderlich',false);return;}
  if(d.options.length<2){toast('❌ Mindestens 2 Antworten erforderlich',false);return;}
  if(d.options.some(o=>!o.emoji||!o.label)){toast('❌ Jede Antwort braucht Emoji und Text',false);return;}
  const emojis=d.options.map(o=>o.emoji);
  if(new Set(emojis).size!==emojis.length){toast('❌ Emojis dürfen nicht doppelt sein',false);return;}
  if(!Number.isFinite(d.duration)||d.duration<=0){toast('❌ Ungültige Dauer',false);return;}
  const btn=document.querySelector('button[onclick="createPollFromDashboard()"]');
  if(btn)btn.disabled=true;
  try{
    const r=await fetch('/api/polls',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      channelId,roleIds,title:d.title,description:d.description,durationMinutes:d.duration,multiple:d.multiple,secret:d.secret,options:d.options
    })});
    const out=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(out.error||'Abstimmung konnte nicht erstellt werden');
    toast('✅ Abstimmung wurde gesendet!');
    await loadPollList();
  }catch(e){toast('❌ '+e.message,false);}
  finally{if(btn)btn.disabled=false;}
}

overview: async()=>{
  const statCard=(icon,id,color,label,bg)=>'<div class="stat-card"><div class="stat-card-icon" style="background:'+bg+'">'+icon+'</div><div><div class="stat-card-val" style="color:'+color+'" id="'+id+'"><div class="skeleton" style="width:60px;height:28px"></div></div><div class="stat-card-lbl">'+label+'</div></div></div>';

  document.getElementById('content').innerHTML=h2t('📊 Übersicht')
    +'<div class="flex gap-2 mb-5"><button id="refreshBtn" onclick="startRefresh(null,\'overview\')" class="btn btn-gray text-xs">⏹ Stop Auto-Refresh</button></div>'
    +'<div class="grid gap-3 mb-6" style="grid-template-columns:repeat(4,1fr)">'
    +statCard('💰','s1','#4DA3FF','rgba(77,163,255,0.15)','Coins-Nutzer')
    +statCard('🏆','s2','#f0b132','rgba(240,177,50,0.15)','Erfolge freigeschaltet')

    +statCard('📅','s4','#a855f7','rgba(168,85,247,0.15)','Weekly-Teilnehmer')
    +'</div>'
    +'<div class="grid gap-4" style="grid-template-columns:repeat(3,1fr)">'
    +card('<h3 class="font-semibold text-white mb-3" style="font-size:.9rem">💰 Top 5 Coins</h3><div id="ov-coins">'+skeleton(5)+'</div>')
    +card('<h3 class="font-semibold text-white mb-3" style="font-size:.9rem">⭐ Top 5 XP</h3><div id="ov-xp">'+skeleton(5)+'</div>')
    +card('<h3 class="font-semibold text-white mb-3" style="font-size:.9rem">🎮 Spiele heute</h3><div id="ov-games">'+skeleton(3)+'</div>')
    +'</div>';
  const render = async () => {
    const [coins,xp,games,ach,weekly]=await Promise.all([
      fetch('/api/leaderboard/coins').then(r=>r.json()).catch(()=>[]),
      fetch('/api/leaderboard/xp').then(r=>r.json()).catch(()=>[]),
      fetch('/api/minigames/stats').then(r=>r.json()).catch(()=>({})),
      fetch('/api/achievements/stats').then(r=>r.json()).catch(()=>({})),
      fetch('/api/weekly').then(r=>r.json()).catch(()=>({}))
    ]);
    const s1=document.getElementById('s1'); if(s1) s1.textContent=coins.length||0;
    const s2=document.getElementById('s2'); if(s2) s2.textContent=ach.totalUnlocked||0;
    const s3=document.getElementById('s3'); if(s3) s3.textContent=games.totalGamesToday||0;
    const s4=document.getElementById('s4'); if(s4) s4.textContent=weekly.participantCount||0;
    const ovCoins=document.getElementById('ov-coins'); if(ovCoins) ovCoins.innerHTML=(coins||[]).slice(0,5).map((u,i)=>'<div class="flex justify-between items-center py-1 border-b border-white/5 text-sm"><span>'+(m[i]||'<span class="text-white/40">#'+(i+1)+'</span>')+' '+uname(u.userId)+'</span><span class="text-yellow-400 font-bold">'+(u.balance||0).toLocaleString()+'</span></div>').join('')||'<p class="text-white/40 text-sm">Keine Daten</p>';
    const ovXp=document.getElementById('ov-xp'); if(ovXp) ovXp.innerHTML=(xp||[]).slice(0,5).map((u,i)=>'<div class="flex justify-between items-center py-1 border-b border-white/5 text-sm"><span>'+(m[i]||'<span class="text-white/40">#'+(i+1)+'</span>')+' '+uname(u.userId)+'</span><span class="text-purple-400 font-bold">Lv.'+u.level+'</span></div>').join('')||'<p class="text-white/40 text-sm">Keine Daten</p>';
    const gd=games.byGame||{};
    const ovGames=document.getElementById('ov-games'); if(ovGames) ovGames.innerHTML=Object.entries(gd).length?Object.entries(gd).map(([g,n])=>'<div class="flex justify-between items-center py-1 border-b border-white/5 text-sm"><span class="text-white/60 capitalize">'+g+'</span><span class="font-bold text-white">'+n+'</span></div>').join(''):'<p class="text-white/40 text-sm">Noch keine Spiele</p>';
  };
  await render();
  if(_refreshTimer){clearInterval(_refreshTimer);_refreshTimer=null;}
  _refreshTimer=setInterval(render, 10000);
  _refreshActive=true;
},

probezeitManagement: async()=>{
  document.getElementById('content').innerHTML=h2t('⏳ Probezeit')+card('<div id="pz-list">Laden…</div>');
  const list=await fetch('/api/probezeiten').then(r=>r.json()).catch(()=>[]);
  const fmt=(ms)=>{
    const s=Math.floor(ms/1000);
    const d=Math.floor(s/86400);
    const h=Math.floor((s%86400)/3600);
    const m=Math.floor((s%3600)/60);
    return d+'d '+h+'h '+m+'m';
  };
  document.getElementById('pz-list').innerHTML=(list.length?tbl(['User','Server','Zielrolle','Start','Ende','Rest','Aktionen'],list.map(p=>row([
    uname(p.userId),
    p.guildId,
    p.zielrolleId,
    p.start?new Date(p.start).toLocaleString('de-DE'):'—',

weekly: async()=>{
  if(_refreshTimer){clearInterval(_refreshTimer);_refreshTimer=null;}
  _refreshActive=false;
  const renderWeekly=async()=>{
    const d=await fetch('/api/weekly').then(r=>r.json()).catch(()=>({}));
    const c=d.campaign;
    const el=document.getElementById('w-info');
    if(!el)return;
    if(!c){el.innerHTML='<p class="text-white/60">Keine aktive Weekly-Mission</p>';return;}
    const mission=c.selectedMissionMeta||{};
    const total=d.totalProgress?.[c.selectedMissionId]||0;
    const target=mission.target||1;
    const pct=Math.min(100,Math.floor((total/target)*100));
    const filled=Math.floor(pct/5);
    const bar='█'.repeat(filled)+'░'.repeat(20-filled);
    const diffColor={'Leicht':'text-green-400','Mittel':'text-blue-400','Extrem':'text-red-400','Spezial':'text-purple-400'}[mission.difficulty]||'text-yellow-400';
    const contributors=d.contributors||[];
    const medalColors=['color:#fde047','color:#d1d5db','color:#d97706'];
    const medals=['🥇','🥈','🥉'];
    const contribRows=contributors.length
      ?'<table style="width:100%;border-collapse:collapse;font-size:13px">'
        +'<thead><tr>'
        +'<th style="text-align:left;padding:4px 8px;color:rgba(255,255,255,0.4);font-weight:normal">#</th>'
        +'<th style="text-align:left;padding:4px 8px;color:rgba(255,255,255,0.4);font-weight:normal">Name</th>'
        +'<th style="text-align:right;padding:4px 8px;color:rgba(255,255,255,0.4);font-weight:normal">Beitrag</th>'
        +'<th style="text-align:right;padding:4px 8px;color:rgba(255,255,255,0.4);font-weight:normal">Anteil</th>'
        +'</tr></thead><tbody>'
        +contributors.map((u,i)=>{
          const share=total>0?Math.round((u.contribution/total)*100):0;
          const medal=i<3?medals[i]:(i+1)+'.';
          const nameColor=i<3?medalColors[i]:'color:rgba(255,255,255,0.85)';
          return '<tr style="border-top:1px solid rgba(255,255,255,0.06)">'
            +'<td style="padding:5px 8px;color:rgba(255,255,255,0.5)">'+medal+'</td>'
            +'<td style="padding:5px 8px;font-weight:'+(i===0?'bold':'normal')+';'+nameColor+'">'+u.name+'</td>'
            +'<td style="padding:5px 8px;text-align:right;color:#fff;font-weight:bold">'+u.contribution.toLocaleString('de-DE')+'</td>'
            +'<td style="padding:5px 8px;text-align:right;color:rgba(255,255,255,0.5)">'+share+'%</td>'
            +'</tr>';
        }).join('')
        +'</tbody></table>'
      :'<p style="color:rgba(255,255,255,0.4);font-size:13px;margin:0">Noch keine Beiträge</p>';
    el.innerHTML='<div class="space-y-3">'
      +'<div class="flex justify-between"><span class="text-white/60">Mission</span><span class="font-bold text-white">'+(mission.name||c.campaignId||'—')+'</span></div>'
      +'<div class="flex justify-between"><span class="text-white/60">Schwierigkeit</span><span class="font-bold '+diffColor+'">'+(mission.difficulty||'—')+'</span></div>'
      +'<div class="flex justify-between"><span class="text-white/60">Beschreibung</span><span class="text-white text-right" style="max-width:60%">'+(mission.description||'—')+'</span></div>'
      +'<div class="flex justify-between"><span class="text-white/60">Kategorie</span><span class="text-white">'+(mission.category||'—')+'</span></div>'
      +'<div class="flex justify-between"><span class="text-white/60">Teilnehmer</span><span class="text-green-400 font-bold">'+(d.participantCount||0)+'</span></div>'
      +'<div class="flex justify-between"><span class="text-white/60">Start</span><span class="text-white">'+(c.weekStart?new Date(c.weekStart).toLocaleString('de-DE'):'—')+'</span></div>'
      +'<hr style="border-color:rgba(255,255,255,0.1);margin:4px 0"/>'
      +'<div>'
        +'<div class="flex justify-between mb-1"><span class="text-white/60">Fortschritt</span><span class="font-bold text-white">'+total.toLocaleString('de-DE')+' / '+target.toLocaleString('de-DE')+'</span></div>'
        +'<div style="font-family:monospace;color:#60a5fa;font-size:13px;letter-spacing:1px">'+bar+' '+pct+'%</div>'
      +'</div>'

    ['Gesendete DMs', stats.stats.sent || 0],
    ['Fehlgeschlagene DMs', stats.stats.failed || 0],
    ['Letzter Fehler', stats.lastError ? stats.lastError.slice(0,120) : '—'],
    ['Letzte API-Abfrage', stats.stats.lastSuccessAt ? new Date(stats.stats.lastSuccessAt).toLocaleString('de-DE') : '—']
  ];
  document.getElementById('auction-stats').innerHTML='<table class="w-full text-sm">'+rows.map(r=>'<tr><td class="text-white/50 py-1" style="width:45%">'+r[0]+'</td><td class="text-white py-1">'+r[1]+'</td></tr>').join('')+'</table>';
};

async function tApi(path, opts={}) {
  const r = await fetch(path, { credentials: 'same-origin', ...opts });
  if (!r.ok) { const d = await r.json().catch(()=>({})); throw new Error(d.error||'Fehler '+r.status); }
  return r.json();
}

function closeModal() {

}

function addFormFieldRow() {
  window._ticketFormFields = window._ticketFormFields || [];
  window._ticketFormFields.push({ id: 'f_'+Date.now()+'_'+Math.random().toString(36).slice(2,5), label:'', style:'short', required:true, placeholder:'', maxLength:4000 });

function removeFormFieldRow(idx) {
  window._ticketFormFields.splice(idx, 1);
  renderFormFieldsRows();
}

function renderFormFieldsRows() {
  const box = document.getElementById('tc-form-fields');
  if (!box) return;
  const fields = window._ticketFormFields || [];
  box.innerHTML = fields.map((f, i) => `
    <div class="flex gap-2 items-start" style="background:rgba(255,255,255,.04);border-radius:8px;padding:.5rem">
      <input class="inp" style="flex:2" placeholder="Label" value="${escapeAttr(f.label)}" oninput="window._ticketFormFields[${i}].label=this.value">
      <select class="inp" style="flex:1;width:auto" onchange="window._ticketFormFields[${i}].style=this.value">
        <option value="short" ${f.style==='short'?'selected':''}>Kurz</option>
        <option value="long" ${f.style==='long'?'selected':''}>Lang</option>
      </select>
      <label class="flex items-center text-xs gap-1" style="width:80px"><input type="checkbox" ${f.required?'checked':''} onchange="window._ticketFormFields[${i}].required=this.checked" style="accent-color:#4DA3FF"> Pflicht</label>

async function saveTicketCategory(id) {
  try {
    const name = document.getElementById('tc-name').value.trim();
    if (!name) return toast('Name erforderlich', false);
    const colorHex = document.getElementById('tc-color').value.trim().replace('#','');
    const color = parseInt(colorHex, 16) || 3447003;
    const staffRoles = document.getElementById('tc-staff-roles').value.split(',').map(s=>s.trim()).filter(Boolean);
    const body = {
      name,
      emoji: document.getElementById('tc-emoji').value.trim() || '🎫',
      description: document.getElementById('tc-description').value.trim(),
      instructions: document.getElementById('tc-instructions').value.trim(),
      color,
      staffRoles,
      channelIds: [],
      formFields: (window._ticketFormFields || []).filter(f => f.label)
    };
    if (id) {
      await tApi('/api/tickets/categories/'+id, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      toast('✅ Kategorie aktualisiert');
    } else {
      await tApi('/api/tickets/categories', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      toast('✅ Kategorie erstellt');
    }
    closeModal();
    await loadTicketCategories();
  } catch(e) { toast(e.message, false); }
}

async function loadTicketList() {
  try {
    const status = document.getElementById('tl-filter-status').value;
    const catSel = document.getElementById('tl-filter-category');
    // Load categories for filter
    if (!catSel.options.length || catSel.options.length === 1) {
      const catData = await tApi('/api/tickets/categories');
      catData.categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id; opt.textContent = c.name;
        catSel.appendChild(opt);
      });
    }
    const categoryId = catSel.value;
    let url = '/api/tickets?limit=200';
    if (status) url += '&status='+status;
    if (categoryId) url += '&categoryId='+categoryId;
    const data = await tApi(url);
    const list = document.getElementById('tl-list');
    if (!data.tickets || !data.tickets.length) {
      list.innerHTML = card('<p class="text-white/50 text-sm text-center py-4">Keine Tickets gefunden.</p>');
      return;
    }
    const statusColors = { open:'#3ba55c', claimed:'#f0b132', closed:'#ed4245' };
    const statusLabels = { open:'Offen', claimed:'Beansprucht', closed:'Geschlossen' };
    const catData = await tApi('/api/tickets/categories');
    const catMap = {}; catData.categories.forEach(c => catMap[c.id] = c);
    list.innerHTML = card(tbl(
      ['ID','Kategorie','User','Status','Claimed by','Erstellt','Aktion'],
      data.tickets.map(t => {
        const cat = catMap[t.categoryId];
        const date = new Date(t.createdAt).toLocaleString('de-DE', { timeZone:'Europe/Berlin' });
        return '<tr>'
          +'<td class="font-mono text-xs">'+escapeHtml(t.id.slice(0,15))+'...</td>'
          +'<td>'+(cat?escapeHtml((cat.emoji||'🎫')+' '+cat.name):escapeHtml(t.categoryId))+'</td>'
          +'<td>'+uname(t.userId)+'</td>'
          +'<td><span class="text-xs px-2 py-.5 rounded" style="background:'+statusColors[t.status]+'20;color:'+statusColors[t.status]+'">'+statusLabels[t.status]+'</span></td>'
          +'<td>'+(t.claimedByName?escapeHtml(t.claimedByName):'—')+'</td>'
          +'<td class="text-xs text-white/50">'+date+'</td>'
          +'<td><button onclick="viewTicketDetail(\''+t.id+'\')" class="btn btn-gray text-xs" style="padding:.2rem .5rem">👁️</button>'
          +(t.status!=='closed'?' <button onclick="closeTicketDashboard(\''+t.id+'\')" class="btn btn-red text-xs" style="padding:.2rem .5rem">🔒</button>':'')
          +'</td>'
          +'</tr>';
      }).join('')
    ));
  } catch(e) { toast(e.message, false); }
}

      +'</div>'
      +(t.formData && Object.keys(t.formData).length ? '<h4 class="font-bold text-white mt-4 mb-2">📝 Formular-Daten</h4>'+Object.entries(t.formData).map(([k,v])=>'<div class="mb-1"><span class="text-white/50 text-xs">'+escapeHtml(k)+':</span> <span class="text-white text-sm">'+escapeHtml(String(v))+'</span></div>').join('') : '')
      );

      html += card('<h3 class="font-bold text-white mb-3">📜 Verlauf</h3>'+data.logs.map(l => '<div class="text-sm mb-1"><span class="text-white/40 text-xs">'+new Date(l.createdAt).toLocaleString('de-DE')+'</span> <span class="text-white">['+escapeHtml(l.action)+']</span> <span class="text-white/60">'+escapeHtml(l.actorName||'')+'</span>'+(l.details?' <span class="text-white/40">'+escapeHtml(l.details)+'</span>':'')+'</div>').join(''));
    }
    if (data.messages && data.messages.length) {
      html += card('<h3 class="font-bold text-white mb-3">💬 Nachrichten ('+data.messages.length+')</h3><div style="max-height:300px;overflow-y:auto">'+data.messages.slice(-50).map(m => '<div class="text-sm mb-2"><span class="text-white/40 text-xs">'+new Date(m.createdAt).toLocaleString('de-DE')+'</span> <span class="text-white/70 font-semibold">'+escapeHtml(m.username||m.userId)+':</span> <span class="text-white/60">'+escapeHtml(m.content.slice(0,200))+'</span></div>').join('')+'</div>');

async function addPublicShopItem(){

function toLocalDateTime(iso){
  if(!iso)return'';
  const d=new Date(iso);
  if(!Number.isFinite(d.getTime()))return'';
  return d.toLocaleString('sv-SE',{timeZone:'Europe/Berlin'}).replace(' ','T').slice(0,16);
}

async function toggleRolePerm(role,perm,enabled){
  const rolesRes=await fetch('/api/roles').catch(()=>null);
  if(!rolesRes||!rolesRes.ok){toast('❌ Rollen konnten nicht geladen werden',false);return;}
  const d=await rolesRes.json().catch(()=>null);
  if(!d||!d.roles){toast('❌ Rollen konnten nicht geladen werden',false);return;}
  const perms=[...(d.roles[role]?.permissions||[])];
  const idx=perms.indexOf(perm);
  if(enabled&&idx===-1)perms.push(perm);
  if(!enabled&&idx!==-1)perms.splice(idx,1);
  const r=await fetch('/api/roles/role/'+role+'/permissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({permissions:perms})});
  if(!r.ok){toast('❌ Berechtigung konnte nicht gespeichert werden',false);return;}
  toast('✅ '+role+': '+perm+' '+(enabled?'an':'aus'));
}

const RM_API = '/proxy/rm';
async function rmFetch(path, method='GET', body){const opts={method,headers:{'Content-Type':'application/json'},credentials:'include'};if(body)opts.body=JSON.stringify(body);try{return await fetch(RM_API+path,opts).then(r=>r.json());}catch(e){return{ok:false,error:'Restart Manager nicht erreichbar'};}}
function fmtUptime(s){if(!s&&s!==0)return'—';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;if(h>0)return h+'h '+m+'m';if(m>0)return m+'m '+sec+'s';return sec+'s';}
function fmtMs(ms){return ms!=null?ms+' ms':'—';}
function fmtDate(iso){if(!iso)return'—';return new Date(iso).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function rmStatusBadge(s){const m={online:'<span style="background:rgba(34,211,160,.15);color:#22d3a0;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700">🟢 Online</span>',offline:'<span style="background:rgba(239,68,68,.15);color:#ef4444;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700">🔴 Offline</span>',starting:'<span style="background:rgba(245,158,11,.15);color:#f59e0b;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700">🟡 Startet…</span>',unknown:'<span style="color:rgba(255,255,255,.4);font-size:.8rem">—</span>'};return m[s]||m.unknown;}
function rmMetricCard(label,value,color){return '<div class="card" style="padding:14px 16px;text-align:center"><p class="text-xs mb-1" style="color:rgba(255,255,255,.5)">'+label+'</p><p class="font-bold" style="color:'+(color||'#fff')+'">'+value+'</p></div>';}
async function rmLoadStatus(){
  const d=await rmFetch('/status');
  if(!d.ok&&!d.data){document.getElementById('rm-content').innerHTML='<div class="card"><p class="text-red-400 font-bold">⚠️ Restart Manager nicht erreichbar – läuft er auf Port 4000?</p></div>';return;}
  const s=d.data||d;
  const ws=s.website||{};const bot=s.bot||{};
  document.getElementById('rm-ws-status').innerHTML=rmStatusBadge(ws.status);
  document.getElementById('rm-ws-rt').textContent=fmtMs(ws.responseTime);
  document.getElementById('rm-ws-cpu').textContent=ws.cpu!=null?ws.cpu+'%':'—';
  document.getElementById('rm-ws-ram').textContent=ws.memory!=null?ws.memory+' MB':'—';
  document.getElementById('rm-ws-uptime').textContent=fmtUptime(ws.uptime);
  document.getElementById('rm-ws-restart').textContent=fmtDate(ws.lastRestart);
  document.getElementById('rm-ws-err').textContent=ws.lastError||'—';
  document.getElementById('rm-bot-status').innerHTML=rmStatusBadge(bot.status);
  document.getElementById('rm-bot-cpu').textContent=bot.cpu!=null?bot.cpu+'%':'—';
  document.getElementById('rm-bot-ram').textContent=bot.memory!=null?bot.memory+' MB':'—';
  document.getElementById('rm-bot-uptime').textContent=fmtUptime(bot.uptime);
  document.getElementById('rm-bot-restart').textContent=fmtDate(bot.lastRestart);
  document.getElementById('rm-bot-err').textContent=bot.lastError||'—';
  document.getElementById('rm-lock').style.display=s.restartLock?'flex':'none';
  const offState=s.offline||{};
  document.getElementById('rm-global-offline').checked=!!offState.globalOffline;
  document.getElementById('rm-global-reason').value=offState.globalReason||'';
}

async function quickToggleLock(enabled){
  const d=await fetch('/api/site-lock').then(r=>r.json()).catch(()=>({reason:'',allowedPages:['/dashboard'],blockedPages:[]}));
  const body={enabled,reason:d.reason||'',allowedPages:d.allowedPages||['/dashboard'],blockedPages:d.blockedPages||[]};

  if(r.ok){toast(enabled?'🔒 Website gesperrt!':'🔓 Website entsperrt!',r.ok);loadSiteLock();}
  else toast('❌ Fehler',false);
}

async function quickLock(enable){
  const reason=document.getElementById('lock-reason')?.value||'';
  const blocked=[],allowed=[];
  document.querySelectorAll('[id^="lock-block-"]').forEach(cb=>{if(cb.checked)blocked.push(cb.getAttribute('data-path'));});
  document.querySelectorAll('[id^="lock-allow-"]').forEach(cb=>{if(cb.checked)allowed.push(cb.getAttribute('data-path'));});
  const body={enabled:enable,reason,blockedPages:blocked,allowedPages:allowed};
  const r=await fetch('/api/site-lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){toast(enable?'🔒 Website gesperrt!':'🔓 Website entsperrt!');loadSiteLock();}
  else toast('❌ Fehler',false);
}

    modal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:1rem';

      <div style="background:#0f1530;border:1px solid rgba(255,255,255,0.1);border-radius:14px;max-width:420px;width:100%;padding:1.5rem;box-shadow:0 20px 60px rgba(0,0,0,0.5)">

    const r = await fetch('/api/guilds');

    if (guilds.length === 0) {
      list.innerHTML = '<div style="color:rgba(255,255,255,0.5);text-align:center;padding:1rem">Keine Server verfügbar</div>';

        ? `<img src="${g.icon}" style="width:32px;height:32px;border-radius:8px;flex-shrink:0" alt="" />`
        : `<div style="width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;flex-shrink:0">🏠</div>`;
      const btn = document.createElement('button');
      btn.style.cssText = `width:100%;display:flex;align-items:center;gap:.6rem;padding:.6rem .75rem;margin-bottom:.4rem;border-radius:9px;border:1px solid ${isCurrent ? 'rgba(77,163,255,0.4)' : 'rgba(255,255,255,0.07)'};background:${isCurrent ? 'rgba(77,163,255,0.12)' : 'rgba(255,255,255,0.03)'};cursor:${isCurrent ? 'default' : 'pointer'};color:#e8eaf6;text-align:left;transition:all .15s`;
      if (!isCurrent) {
        btn.onmouseenter = () => { btn.style.background = 'rgba(255,255,255,0.08)'; };
        btn.onmouseleave = () => { btn.style.background = 'rgba(255,255,255,0.03)'; };
        btn.onclick = () => switchGuild(g.id);
      }
      btn.innerHTML = `${icon}<span style="flex:1;font-size:.88rem">${g.name}</span><span style="font-size:.72rem;color:rgba(255,255,255,0.4)">${g.memberCount || 0} Mitglieder</span>${isCurrent ? '<span style="font-size:.7rem;color:#7dc4ff;font-weight:600">✓ Aktuell</span>' : ''}`;
      list.appendChild(btn);
    }
  } catch (e) {
    list.innerHTML = '<div style="color:#f87171;text-align:center;padding:1rem">Verbindungsfehler</div>';
  }
}

function closeGuildSwitcher() {
  const modal = document.getElementById('guildSwitchModal');
  if (modal) modal.style.display = 'none';
}

async function switchGuild(guildId) {
  try {
    const r = await fetch('/api/switch-guild', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guildId })
    });
    const d = await r.json();
    if (r.ok && d.success) {
      window.location.href = d.redirect || `/dashboard/${guildId}`;
    } else {
      alert(d.error || 'Server-Wechsel fehlgeschlagen');
    }
  } catch (e) {
    alert('Verbindungsfehler');
  }
}
